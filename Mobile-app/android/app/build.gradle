apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

project.ext.react = [
    bundleInDebug: true,
    entryFile: "index.js"
]

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.nana.robot"
    defaultConfig {
        applicationId "com.ajrgroup.nanabot"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                cppFlags "-Wl,-z,max-page-size=16384"
            }
            ndkBuild {
                arguments "APP_LDFLAGS+=-Wl,-z,max-page-size=16384"
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
    implementation platform('com.google.firebase:firebase-bom:32.2.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-functions'
    implementation project(':react-native-async-storage_async-storage')
    implementation project(':react-native-firebase_app')
    implementation project(':react-native-firebase_auth')
    implementation project(':react-native-firebase_database')
    implementation project(':react-native-firebase_functions')
    implementation project(':react-native-svg')
}

apply plugin: 'com.google.gms.google-services'

task bundleReactNative(type: Exec) {
    workingDir '../../'
    commandLine 'cmd', '/c', 'npx', 'react-native', 'bundle', '--platform', 'android', '--dev', 'false', '--entry-file', 'index.js', '--bundle-output', 'android/app/src/main/assets/index.android.bundle', '--assets-dest', 'android/app/src/main/res'
}

project.afterEvaluate {
    tasks.findByName('mergeDebugAssets')?.dependsOn bundleReactNative
    tasks.findByName('mergeReleaseAssets')?.dependsOn bundleReactNative
}


